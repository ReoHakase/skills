name: APM Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Show APM version
        run: nix shell github:numtide/llm-agents.nix#apm -c apm --version

      - name: Validate APM install
        run: nix shell github:numtide/llm-agents.nix#apm -c apm install

      - name: Audit APM dependencies
        run: nix shell github:numtide/llm-agents.nix#apm -c apm audit
