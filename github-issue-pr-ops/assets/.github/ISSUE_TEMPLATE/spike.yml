# このファイルを .github/ISSUE_TEMPLATE/spike.yml へコピーする。
name: 調査Issue
description: 実装前の不確実性を減らす、時間を区切った調査Issueを作る。
body:
  - type: markdown
    attributes:
      value: |
        時間枠、停止条件、証拠、判断、後続Issueの要否を明確にする。
        Issue本文は常体で書く。調査だけで本番機能を完成させない。
        Milestone、依存、Assignee、branch、PR、構造化フィールドは本文へ重複させない。

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: この調査で減らす不確実性を書く。
      placeholder: 検索APIの応答を場面起点にするか動画起点にするか判断する。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 調査せず実装を始めると危険な理由を書く。
      placeholder: 応答仕様が決まらないと画面とAPIを安全に並列実装できない。
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: 調査する問い
      description: この調査で答える具体的な問いを書く。
      placeholder: |
        - 調査で答える問いを書く。
    validations:
      required: true

  - type: textarea
    id: timebox
    attributes:
      label: 時間枠
      description: 調査の上限時間と中間確認の区切りを書く。
      placeholder: |
        上限: 4時間
        中間確認: 2時間経過時に証拠と残りの問いを整理する。
    validations:
      required: true

  - type: textarea
    id: stop-conditions
    attributes:
      label: 停止条件
      description: 早期終了条件と、結論が出ない場合の打ち切り条件を書く。
      placeholder: |
        - 判断に必要な証拠が揃ったら終了する。
        - 上限時間に達したら未解決点を残して打ち切る。
    validations:
      required: true

  - type: textarea
    id: investigation-plan
    attributes:
      label: 調査手順
      description: 必要最小限の実験、文書確認、コード読解、試作を書く。
      placeholder: |
        - [ ] 調査手順を書く。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 成果物と証拠
      description: 判断の根拠となる測定結果、再現手順、コード参照、公式文書を書く。
      placeholder: |
        - [ ] 実験の入力、条件、結果を残す。
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: 判断基準
      description: 起票時は候補と選定条件、完了時は採用案、棄却案、理由、残った不確実性を書く。
      placeholder: |
        候補:
        - 候補案を書く。

        判断基準:
        - 判断基準を書く。

        完了時の結論:
        - 調査完了時に更新する。
    validations:
      required: true

  - type: textarea
    id: follow-up
    attributes:
      label: 後続Issue
      description: 起票時は候補、完了時は「不要」と理由、または作成したIssue番号を書く。
      placeholder: |
        想定する後続作業:
        - 後続作業を書く。

        完了時の判定:
        - 不要: 理由 / 必要: #...
    validations:
      required: true

  - type: textarea
    id: non-scope
    attributes:
      label: 非スコープ
      description: この調査Issueでは実装しないことを書く。
      placeholder: |
        - 本番機能は実装しない。
    validations:
      required: true

  - type: textarea
    id: changed-files
    attributes:
      label: 変更ファイル
      description: 変更する場合はglob、変更しない場合は「なし（リポジトリ差分なし）」と書く。
      placeholder: |
        - なし（リポジトリ差分なし）
    validations:
      required: true

  - type: textarea
    id: reference-documents
    attributes:
      label: 参照ドキュメント
      description: 根拠資料がある場合はコミットSHAと行番号に固定する。存在しない場合は理由付きで「なし」と書く。
      placeholder: |
        https://github.com/OWNER/REPO/blob/<COMMIT_SHA>/docs/spec.md#L10-L40
        更新確認: https://github.com/OWNER/REPO/compare/<COMMIT_SHA>...<DEFAULT_BRANCH>
        または: なし（調査対象を規定する既存資料がないため）
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: 調査を完了できる第三者判定可能な条件を書く。
      placeholder: |
        - [ ] 成果物と証拠が残っている。
        - [ ] 判断と後続Issueの要否が更新されている。
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 証拠と判断を第三者が追試または確認する手順を書く。
      placeholder: |
        - [ ] 確認コマンドまたは文書の確認手順を書く。
    validations:
      required: true
