# このファイルを .github/ISSUE_TEMPLATE/feature.yml へコピーする。
name: 機能追加 / 作業Issue
description: 作業範囲と確認手順が明確な、1つのPRで閉じられるIssueを作る。
body:
  - type: markdown
    attributes:
      value: |
        1つのbranchと1つのPRで完了できる作業に使う。
        Issue本文は常体で書く。丁寧体は使わない。
        Milestone、親子関係、依存、Assignee、branch、PR、構造化フィールドは本文へ重複させない。

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: 何ができるようになるか、またはどんな運用価値が増えるかを書く。
      placeholder: 検索結果カードで、各結果が一致した理由を確認できるようにする。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ今必要かを書く。利用者の困りごとや依存関係の文脈を含める。
      placeholder: 現状では、どの場面がなぜ一致したか判断できない。
    validations:
      required: true

  - type: textarea
    id: non-scope
    attributes:
      label: 非スコープ
      description: 関連するが、このIssueでは意図的に扱わないことを書く。
      placeholder: |
        - このIssueでは扱わないことを書く。
    validations:
      required: true

  - type: textarea
    id: changed-files
    attributes:
      label: 変更ファイル
      description: 変更予定のファイルをglobだけで書く。並列作業の競合判定に使う。
      placeholder: |
        - `src/**/*.ts`
        - `tests/**/*.test.ts`
    validations:
      required: true

  - type: textarea
    id: reference-documents
    attributes:
      label: 参照ドキュメント
      description: 規範資料がある場合はコミットSHAと行番号に固定する。存在しない場合は理由付きで「なし」と書く。
      placeholder: |
        https://github.com/OWNER/REPO/blob/<COMMIT_SHA>/docs/spec.md#L10-L40
        更新確認: https://github.com/OWNER/REPO/compare/<COMMIT_SHA>...<DEFAULT_BRANCH>
        または: なし（この作業を規定する既存資料がないため）
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: 第三者が観測できる完了条件を書く。
      placeholder: |
        - [ ] 確認できる条件を書く。
        - [ ] 確認できる条件を書く。
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 具体的な自動テストまたは手動確認を書く。「確認済み」だけで終わらせない。
      placeholder: |
        - [ ] 実行するテストまたは手動確認を書く。
    validations:
      required: true
