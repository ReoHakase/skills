pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,jsx,json,jsonc,json5,yml,yaml,toml,md,mdx}"
      run: bun oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase
    apm-audit-skill:
      glob: "*/*"
      run: apm audit --verbose --strip --file {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase

commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}
