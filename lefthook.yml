pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,jsx,json,jsonc,json5,yml,yaml,toml,md,mdx}"
      run: bunx oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
