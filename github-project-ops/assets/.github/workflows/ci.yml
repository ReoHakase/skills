# このファイルを .github/workflows/ci.yml へコピーする。
# branch protectionのrequired checkにするjob名は、repo側の設定と一致させる。
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    name: 確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: repository固有のcheck commandを設定する
        run: |
          echo "::error::このplaceholderをrepository固有のcheck commandへ置き換えてください"
          exit 1
