# このファイルを .github/workflows/ci.yml へコピーする。
# branch protectionのrequired checkにするjob名は、repo側の設定と一致させる。
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  test:
    name: 確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check commandを実行
        run: |
          echo "repo固有のcheck commandに置き換える"
