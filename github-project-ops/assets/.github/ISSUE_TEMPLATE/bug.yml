# このファイルを .github/ISSUE_TEMPLATE/bug.yml へコピーする。
# GitHub Projectsの項目は本文に転記せず、Issue作成後にProject上で設定する。
name: 不具合報告
description: 期待動作と異なる、再現可能な不具合を報告する。
body:
  - type: markdown
    attributes:
      value: |
        1つのブランチと1つのPRで修正できる不具合に使う。
        Issue本文は常体で書く。丁寧体は使わない。
        期待動作、実際の動作、再現手順、環境、ログと証拠、影響範囲、変更ファイル、参照ドキュメント、修正の受け入れ条件、確認手順を書く。

        GitHub Projectsの項目はIssue本文に転記せず、Issue作成後にProject上で設定する。

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: 発生している不具合を1〜3文で要約する。
      placeholder: 分割動画の境界ぴったりの時刻が、前のパートとして解決されることがある。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 不具合が発覚した経緯と、なぜ修正が必要かを書く。
      placeholder: 検索結果からプレイヤーへ移動したときに別の場面が開かれた。
    validations:
      required: true

  - type: textarea
    id: non-scope
    attributes:
      label: 非スコープ
      description: 関連するが、このIssueでは意図的に修正しないことを書く。
      placeholder: |
        - このIssueでは扱わないことを書く
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待動作
      description: 正しい動作を、第三者が確認できる形で書く。
      placeholder: 境界時刻は次のパートの `local_time_ms=0` として解決される。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に起きている動作、発生頻度、観測した条件を書く。
      placeholder: 同じ時刻が、前のパートの末尾として扱われることがある。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 別の人やエージェントが同じ状態を再現できる、具体的な手順を書く。
      placeholder: |
        1. ...を開く
        2. ...を実行する
        3. ...になることを確認する
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 再現性に影響するOS、ブラウザ、実行環境、端末、コミット、バージョンなどを書く。関係ない項目は省く。
      placeholder: |
        - OS:
        - ブラウザ / 端末:
        - 実行環境:
        - コミット / バージョン:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ・証拠
      description: 関連する最小限のログやエラーを書く。秘密情報、認証情報、個人情報は削除し、履歴にも残さない。ない場合は「なし」と書く。
      placeholder: |
        関連する最小限のログ抜粋を貼る。
        秘密情報、認証情報、個人情報は貼らない。
        ログやエラー出力がない場合は「なし」と書く。
      render: shell
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: 影響するユーザー、機能、データ、運用、頻度を具体的に書く。GitHub Projectsに設定する優先度や危険度の値は書かない。
      placeholder: |
        - 影響するユーザー:
        - 影響する機能 / データ:
        - 発生頻度:
    validations:
      required: true

  - type: textarea
    id: changed-files
    attributes:
      label: 変更ファイル
      description: 変更予定のファイルをglobパターンだけで書く。並列作業の競合判定に使う。
      placeholder: |
        - `src/**/*.ts`
        - `tests/**/*.test.ts`
    validations:
      required: true

  - type: textarea
    id: reference-documents
    attributes:
      label: 参照ドキュメント
      description: 期待動作の根拠となる仕様や設計のURLをコミットSHAと行番号に固定して書く。ブランチ名、可変URL、「なし」は認めない。
      placeholder: |
        https://github.com/OWNER/REPO/blob/<COMMIT_SHA>/docs/spec.md#L10-L40
        更新確認: https://github.com/OWNER/REPO/compare/<COMMIT_SHA>...<DEFAULT_BRANCH>
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 修正の受け入れ条件
      description: 不具合が直ったと判断できる、観測可能な条件を書く。
      placeholder: |
        - [ ] 境界時刻が次のパートとして解決される。
        - [ ] 境界以外の時刻の挙動が変わっていない。
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 修正後に通す自動テストまたは手動確認を書く。未実施予定の確認があれば理由も書く。
      placeholder: |
        - [ ] ...を実行する
        - [ ] ...を手動確認する
    validations:
      required: true
