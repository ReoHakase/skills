# このファイルを .github/ISSUE_TEMPLATE/spike.yml へコピーする。
# GitHub Projectsの項目は本文に転記せず、Issue作成後にProject上で設定する。
name: 調査Issue
description: 実装前の不確実性を減らす、時間を区切った調査Issueを作る。
body:
  - type: markdown
    attributes:
      value: |
        不確実性を減らすまで実装を始めるべきでない作業に使う。
        Issue本文は常体で書く。丁寧体は使わない。

        時間枠、停止条件、残す証拠、終了時の判断、後続Issueの要否を明確にする。

        GitHub Projectsの項目はIssue本文に転記せず、Issue作成後にProject上で設定する。

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: この調査でどの不確実性を減らすかを書く。
      placeholder: 検索APIのレスポンスをシーン起点にするか、動画起点にするかを判断する。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: この調査なしで実装に入ると危ない理由を書く。
      placeholder: レスポンス仕様が決まらないと、UIとバックエンドを安全に並列実装できない。
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: 調査する問い
      description: この調査で答えるべき具体的な問いを書く。
      placeholder: |
        - 調査で答える問いを書く
        - 調査で答える問いを書く
    validations:
      required: true

  - type: textarea
    id: timebox
    attributes:
      label: 時間枠
      description: 調査に使う上限時間と、中間確認の区切りを書く。ProjectのEffort値は転記しない。
      placeholder: |
        上限: 4時間
        中間確認: 2時間経過時に証拠と残りの問いを整理する。
    validations:
      required: true

  - type: textarea
    id: stop-conditions
    attributes:
      label: 停止条件
      description: 時間枠を使い切る前も終了できる条件と、結論が出ない場合の打ち切り条件を書く。
      placeholder: |
        - 判断に必要な証拠が揃ったら終了する。
        - 上限時間に達したら、未解決点を残して打ち切る。
    validations:
      required: true

  - type: textarea
    id: investigation-plan
    attributes:
      label: 調査手順
      description: 必要最小限の実験、文書確認、コード読解、試作を書く。
      placeholder: |
        - [ ] 調査手順を書く
        - [ ] 調査手順を書く
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 成果物と証拠
      description: 判断の根拠として残す測定結果、再現手順、コード参照、公式文書などを書く。
      placeholder: |
        - [ ] 実験の入力、条件、結果を残す。
        - [ ] 判断に使ったコードまたは文書を参照する。
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: 判断基準
      description: 起票時は候補と判断基準を書く。終了時に採用案、棄却案、理由、残った不確実性へ更新する。
      placeholder: |
        候補:
        - 候補案1
        - 候補案2

        判断基準:
        - 判断基準1

        終了時の結論:
        - 調査完了時に更新する。
    validations:
      required: true

  - type: textarea
    id: follow-up
    attributes:
      label: 後続Issue
      description: 起票時は想定する後続作業を書く。終了時に「不要」と理由、または作成したIssue番号へ更新する。
      placeholder: |
        想定する後続作業:
        - 後続作業の候補を書く。

        終了時の判定:
        - 不要: 理由を書く / 必要: #...
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: 非スコープ
      description: この調査Issueでは実装しないことを書く。
      placeholder: |
        - この調査Issueでは実装しないことを書く
    validations:
      required: true

  - type: textarea
    id: changed-files
    attributes:
      label: 変更ファイル
      description: 調査でリポジトリを変更する場合はglobパターンだけで書く。変更しない場合は「なし（リポジトリ差分なし）」と書く。
      placeholder: |
        - なし（リポジトリ差分なし）
    validations:
      required: true

  - type: textarea
    id: reference-documents
    attributes:
      label: 参照ドキュメント
      description: 起票時に判明している仕様や設計のURLをコミットSHAと行番号に固定して書く。ブランチ名、可変URL、「なし」は認めない。
      placeholder: |
        https://github.com/OWNER/REPO/blob/<COMMIT_SHA>/docs/spec.md#L10-L40
        更新確認: https://github.com/OWNER/REPO/compare/<COMMIT_SHA>...<DEFAULT_BRANCH>
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: 調査を完了できる、第三者が判定可能な条件を書く。
      placeholder: |
        - [ ] 成果物と証拠が残っている。
        - [ ] 判断と後続Issueの要否が更新されている。
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 証拠と判断を第三者が追試または確認する手順を書く。
      placeholder: |
        - [ ] 実行するコマンドまたは文書の確認手順を書く。
    validations:
      required: true
