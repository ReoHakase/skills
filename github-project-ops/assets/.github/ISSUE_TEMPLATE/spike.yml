# このファイルを .github/ISSUE_TEMPLATE/spike.yml へコピーする。
# GitHub Projectsのメタデータは本文に書かない。Issue作成後に Type、Scope、
# Status、Priority、Size、Complexity、Risk、Agent Tier、Source、担当者系項目を
# GitHub Projectsで設定する。
name: 調査Issue
description: 実装前の不確実性を減らす、時間を区切った調査Issueを作る。
body:
  - type: markdown
    attributes:
      value: |
        不確実性を減らすまで実装を始めるべきでない作業に使う。
        Issue本文は常体で書く。丁寧体は使わない。

        GitHub ProjectsのメタデータはIssue本文に書かない。Type、Scope、Status、Priority、Size、Complexity、Risk、Agent Tier、Source、Agent Harness、Agent Model、Reviewer Owner、Branch、日付系項目はGitHub Projectsで設定する。

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: この調査でどの不確実性を減らすかを書く。
      placeholder: 検索APIのレスポンスをシーン起点にするか、動画起点にするかを判断する。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: この調査なしで実装に入ると危ない理由を書く。
      placeholder: レスポンス仕様が決まらないと、UIとバックエンドを安全に並列実装できない。
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: 調査質問
      description: この調査で答えるべき具体的な問いを書く。
      value: |
        - 調査で答える問いを書く
        - 調査で答える問いを書く
    validations:
      required: true

  - type: textarea
    id: investigation-plan
    attributes:
      label: 調査手順
      description: 必要最小限の実験、文書確認、コード読解、試作を書く。
      value: |
        - [ ] 調査手順を書く
        - [ ] 調査手順を書く
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 成果物
      description: この調査を閉じるときに残すべき成果物を書く。
      value: |
        - [ ] 判断結果の要約
        - [ ] 後続Issueまたは更新した受け入れ条件
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: 非ゴール
      description: この調査Issueでは実装しないことを書く。
      value: |
        - この調査Issueでは実装しないことを書く
    validations:
      required: true
