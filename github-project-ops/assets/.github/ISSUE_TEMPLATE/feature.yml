# このファイルを .github/ISSUE_TEMPLATE/feature.yml へコピーする。
# GitHub Projectsの項目は本文に転記せず、Issue作成後にProject上で設定する。
name: 機能追加 / 作業Issue
description: 作業範囲と確認手順が明確な、ブランチを作れる実装Issueを作る。
body:
  - type: markdown
    attributes:
      value: |
        1つのブランチと1つのPRで完了できる作業に使う。
        Issue本文は常体で書く。丁寧体は使わない。

        GitHub Projectsの項目はIssue本文に転記せず、Issue作成後にProject上で設定する。

  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: 何ができるようになるか、またはどんな運用価値が増えるかを書く。
      placeholder: 検索結果カードで、各結果が一致した理由を確認できるようにする。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ今必要かを書く。ユーザーの困りごと、運用上の理由、依存関係の文脈を含める。
      placeholder: 現状では動画全体のメタデータしか見えず、どのシーンがなぜ一致したか判断できない。
    validations:
      required: true

  - type: textarea
    id: non-scope
    attributes:
      label: 非スコープ
      description: 関連するが、このIssueでは意図的に扱わないことを書く。
      placeholder: |
        - このIssueでは扱わないことを書く
    validations:
      required: true

  - type: textarea
    id: changed-files
    attributes:
      label: 変更ファイル
      description: 変更予定のファイルをglobパターンだけで書く。並列作業の競合判定に使う。
      placeholder: |
        - `src/**/*.ts`
        - `tests/**/*.test.ts`
    validations:
      required: true

  - type: textarea
    id: reference-documents
    attributes:
      label: 参照ドキュメント
      description: 仕様や設計のURLをコミットSHAと行番号に固定して書く。ブランチ名、可変URL、「なし」は認めない。
      placeholder: |
        https://github.com/OWNER/REPO/blob/<COMMIT_SHA>/docs/spec.md#L10-L40
        更新確認: https://github.com/OWNER/REPO/compare/<COMMIT_SHA>...<DEFAULT_BRANCH>
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件
      description: レビュアーが確認できる、観測可能な完了条件を書く。
      placeholder: |
        - [ ] 確認できる条件を書く
        - [ ] 確認できる条件を書く
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 具体的な自動テストまたは手動確認を書く。「完了」「確認済み」だけで終わらせない。
      placeholder: |
        - [ ] 実行するテストまたは手動確認を書く
    validations:
      required: true
